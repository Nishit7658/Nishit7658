<!DOCTYPE html>
<html>
<head>
    <title>Spam Detector</title>
</head>
<body>
    <h2>Indian Spam Message Detector</h2>
    <form method="POST">
        <textarea name="message" rows="5" cols="50" placeholder="Enter your message here"></textarea><br>
        <input type="submit" value="Check">
    </form>
    {% if prediction %}
    <h3>Prediction: {{ prediction }}</h3>
    {% endif %}
</body>
</html>
